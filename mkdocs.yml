site_name: Cloud Native Abidjan
site_description: Cloud Native Abidjan — Learn • Share • Build • Together
site_url: https://cloud-native-abidjan.github.io/community-docs/

# Community hub, not a technical documentation portal.
theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.top
  palette:
    - scheme: default
      primary: blue
      accent: light blue
  font:
    text: Roboto
    code: Roboto Mono

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.superfences
  - pymdownx.blocks.caption

plugins:
  - glightbox:
      touchNavigation: true
      loop: false
      zoomable: true

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/linkedin
      name: LinkedIn
      link: https://www.linkedin.com/company/cloud-native-abidjan/
    - icon: fontawesome/brands/github
      name: GitHub
      link: https://github.com/Cloud-Native-Abidjan
    - icon: fontawesome/brands/whatsapp
      name: WhatsApp
      link: https://chat.whatsapp.com/BqhizdWbC4e1lpPcJiCayW
    - icon: fontawesome/solid/envelope
      name: Email
      link: mailto:cloudnativeabidjan@gmail.com

copyright: Cloud Native Abidjan

nav:
  - Accueil: index.md
  - Rejoindre: join-community.md
  - Événements: events.md
  - Communauté: community.md
