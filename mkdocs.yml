site_name: Cloud Native Abidjan
site_description: Documentation officielle de Cloud Native Abidjan — Learn • Share • Build • Together
site_url: https://cloud-native-abidjan.github.io/community-docs/
repo_url: https://github.com/Cloud-Native-Abidjan/community-docs
repo_name: Cloud-Native-Abidjan/community-docs

theme:
  name: material
  language: fr
  features:
    - navigation.instant
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Mode clair

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.blocks.caption

plugins:
  - search
  - glightbox

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Accueil: index.md
  - Rejoindre la communauté: join-community.md
  - Événements: events.md
  - Communauté: community.md
